<title>Khoa học tự nhiên 7 | Các phần bài học</title>
<style>
:root{--bg:#f3f8f1;--card:#fff;--ink:#1e3a2a;--muted:#5d7566;--accent:#2e8b57;--accent-d:#216b42}
@media (prefers-color-scheme:dark){:root{--bg:#14211a;--card:#1d2f24;--ink:#e6f2ea;--muted:#9bb4a5;--accent:#3fae71;--accent-d:#58c88a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:640px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{margin:0 0 24px;color:var(--muted)}
nav{display:grid;gap:12px}
a.btn{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);color:var(--ink);text-decoration:none;border-radius:14px;border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s,border-color .15s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
.num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.txt{font-weight:600;flex:1}
.go{color:var(--accent-d);font-size:1.2rem}
</style>
</head>

<a class="btn" href="2.%20V%E1%BA%ADn%20chuy%E1%BB%83n%20c%C3%A1c%20ch%E1%BA%A5t%20trong%20th%C3%A2n.html" target="_blank" rel="noopener"><span class="num">2</span><span class="txt">Vận chuyển các chất trong thân</span><span class="go">↗</span></a>
<a class="btn" href="3.%20Tho%C3%A1t%20h%C6%A1i%20n%C6%B0%E1%BB%9Bc%20%E1%BB%9F%20l%C3%A1.html" target="_blank" rel="noopener"><span class="num">3</span><span class="txt">Thoát hơi nước ở lá</span><span class="go">↗</span></a>
